[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betl"
version = "0.1.2"
description = "Una descripción corta de tu librería"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy >= 1.24, < 2.4.0",              # <-- Esto soluciona el conflicto con PaddleX
    "paddleocr >= 3.7.0",
    "ddddocr >= 1.6.1",
    "pydantic >= 2.0.0",
    "pymupdf >= 1.24.0",
    "requests >= 2.30.0",
    "opencv-python >= 4.0.0",
    "opencv-contrib-python >= 4.0.0",
]
[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[project.urls]
Homepage = "https://github.com"
