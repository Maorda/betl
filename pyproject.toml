[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betl"
version = "0.1.9"  # Bumped to reflect the fix
description = "Una descripción corta de tu librería"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "docling>=2.0.0",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
    "ijson>=3.3.0",
    "requests>=2.32.0",
    "streamlit>=1.30.0",
    "google-genai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "google-api-python-client>=2.118.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.27.0",
    "PyYAML==6.0.3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "faker>=20.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["dantesito/chasky/*","dantesito/quipu/*"]

[project.urls]
Homepage = "https://github.com"